<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Warehouse Dashboard</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <h1>Warehouse Dashboard</h1>

    <div id="shelves"></div>

    <h2>Task Board</h2>
    <div id="tasks"></div>

    <script>
        async function loadPackages() {
            const res = await fetch('/api/packages');
            return await res.json();
        }

        function getColor(status) {
            switch(status) {
                case 'Waiting for check-in': return 'yellow';
                case 'Preparing for Movement': return 'orange';
                case 'Ready for delivery': return 'green';
                case 'Temporary Overflow': return 'red';
                case 'Out for Delivery': return 'blue';
                default: return 'gray';
            }
        }

        async function displayWarehouse() {
            const packages = await loadPackages();

            // Assign shelves automatically (3 packages per shelf)
            const shelves = {};
            packages.forEach((pkg, index) => {
                if (!pkg.shelf) {
                    const shelfNum = (index % 5) + 1; // 5 shelves for demo
                    if (!shelves['O'+shelfNum]) shelves['O'+shelfNum] = [];
                    if (shelves['O'+shelfNum].length < 3) {
                        pkg.shelf = 'O'+shelfNum;
                    } else {
                        pkg.shelf = 'TM'; // Temporary overflow
                        pkg.status = 'Temporary Overflow';
                    }
                }
            });

            // Save updated shelves
            for (const pkg of packages) {
                await fetch('/api/packages/' + pkg.id, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ shelf: pkg.shelf, status: pkg.status })
                });
            }

            // Display shelves
            const shelfDiv = document.getElementById('shelves');
            shelfDiv.innerHTML = '';
            const grouped = {};
            packages.forEach(pkg => {
                if (!grouped[pkg.shelf]) grouped[pkg.shelf] = [];
                grouped[pkg.shelf].push(pkg);
            });
            for (const shelf in grouped) {
                const shelfBlock = document.createElement('div');
                shelfBlock.innerHTML = `<h3>${shelf}</h3>`;
                grouped[shelf].forEach(pkg => {
                    const pkgDiv = document.createElement('div');
                    pkgDiv.innerText = `${pkg.id} (${pkg.status})`;
                    pkgDiv.style.backgroundColor = getColor(pkg.status);
                    pkgDiv.style.margin = '2px';
                    pkgDiv.style.padding = '2px';
                    shelfBlock.appendChild(pkgDiv);
                });
                shelfDiv.appendChild(shelfBlock);
            }

            // Task board
            const tasksDiv = document.getElementById('tasks');
            tasksDiv.innerHTML = '';
            packages.forEach(pkg => {
                if (pkg.status === 'Waiting for check-in' || pkg.status === 'Preparing for Movement') {
                    const taskDiv = document.createElement('div');
                    taskDiv.innerText = `${pkg.id}: ${pkg.status}`;
                    tasksDiv.appendChild(taskDiv);
                }
            });
        }

        displayWarehouse();
        setInterval(displayWarehouse, 5000); // refresh every 5 seconds
    </script>
</body>
</html>
